<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - E-Commerce</title>
    <!-- นำ CSS ของโปรเจคมาใช้ -->
    <link rel="stylesheet" href="css/core-style.css"> 
</head>
<body>
    <div class="login-container">
        <h2>เข้าสู่ระบบ</h2>
        <form id="loginForm">
            <div>
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <!-- ไว้แสดงข้อความ Error -->
        <p id="errorMessage" style="color:red;"></p> 
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        try {
            // แก้ไข URL ให้มี /auth/ และแก้ Body ให้ส่ง username แทน email
            const response = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass }) // เปลี่ยนตรงนี้ครับ
            });

            const data = await response.json();

            if (response.ok) {
                // เก็บ Token และชื่อเพื่อใช้ใน authN.js
                localStorage.setItem('amado_token', data.token);
                localStorage.setItem('displayName', data.user.first_name); 
                window.location.href = 'index.html'; 
            } else {
                document.getElementById('errorMessage').innerText = data.message || "ล็อกอินไม่สำเร็จ";
            }
        } catch (err) {
            console.error("Connection Error:", err);
            document.getElementById('errorMessage').innerText = "เซิร์ฟเวอร์ไม่ตอบสนอง";
        }
    });
</script>
</body>
</html>
