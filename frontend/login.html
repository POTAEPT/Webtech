<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - E-Commerce</title>
    <!-- นำ CSS ของโปรเจคมาใช้ -->
    <link rel="stylesheet" href="css/core-style.css"> 
</head>
<body>
    <div class="login-container">
        <h2>เข้าสู่ระบบ</h2>
        <form id="loginForm">
            <div>
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <!-- ไว้แสดงข้อความ Error -->
        <p id="errorMessage" style="color:red;"></p> 
    </div>

<script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรชตอนกด Submit

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                // 1. ยิง Request ไปที่ Backend Controller ของเรา
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: user, password: pass })
                });

                // แปลงผลลัพธ์ที่ตอบกลับมาจาก Backend ให้เป็น JSON
                const data = await response.json();

                // 2. เช็ค Status Code ถ้า 200 OK แปลว่า Login สำเร็จ
                if (response.ok) {
                    // 3. เก็บ JWT Token ลงใน LocalStorage แทนการใช้แค่ค่า true
                    localStorage.setItem('amado_token', data.token);
                    
                    // เก็บชื่ออีเมลไว้แสดงผลบน Navbar ชั่วคราว
                    localStorage.setItem('displayName', user); 
                    
                    // 4. พากลับไปหน้าหลัก
                    window.location.href = 'index.html'; 
                } else {
                    // ถ้ารหัสผิด Backend จะส่ง message กลับมา (เช่น Invalid credentials.)
                    document.getElementById('errorMessage').innerText = data.message;
                }
            } catch (err) {
                console.error("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้:", err);
                document.getElementById('errorMessage').innerText = "เซิร์ฟเวอร์หลังบ้านไม่ตอบสนอง";
            }
        });
    </script>
</body>
</html>
